name: CI

on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**', 'refactor/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Copy database files
        run: npm run copy-db

      - name: Sync learn content
        run: npm run sync

      - name: Validate citations
        run: npm run validate:citations

      - name: Validate question bank
        if: ${{ hashFiles('src/content/questions/**/*.yaml') != '' }}
        run: npm run validate:questions

      - name: Validate challenge tracks
        if: ${{ hashFiles('src/content/challenges/**/*.yaml') != '' }}
        run: npm run validate:challenges

      - name: Validate lab simulation cases
        if: ${{ hashFiles('src/content/cases/**/*.yaml') != '' }}
        run: npm run validate:cases

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

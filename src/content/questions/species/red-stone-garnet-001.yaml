id: red-stone-garnet-001
stem: |
  A red faceted stone is tested in the laboratory. Results: single constant shadow
  edge on the refractometer at approximately 1.75, SG 3.82, uniformly dark on the
  polariscope except for occasional irregular patchy lightening that does not follow
  the four-position pattern. No fluorescence under LWUV. The student initially suspects
  ruby. Which identification is most consistent with these results, and what does the
  irregular patchy polariscope response signify?
type: mcq
options:
  - text: "Almandine garnet; SG 3.82 and RI approximately 1.75–1.77 are within almandine range; the patchy polariscope response is anomalous double refraction (ADR), common in cubic garnets due to strain"
    isCorrect: true
    rationale: |
      Almandine (Fe-Al garnet) is cubic and isotropic, with RI typically 1.770–1.830
      and SG 3.9–4.2 [ref:read-gemmology-3e] – the measured 1.75 and 3.82 fall within the lower end of almandine
      or could indicate a pyrope-almandine intermediate (rhodolite). The single constant
      edge confirms isotropic (cubic) behaviour. The patchy, irregular lightening on the
      polariscope is anomalous double refraction (ADR): strain birefringence from growth
      stress or compositional variation, appearing as irregular patches rather than
      systematic four-position lighting [ref:read-gemmology-3e]. ADR is especially common in almandine [ref:read-gemmology-3e].
  - text: "Ruby; the patchy polariscope response means the stone was examined down the optic axis, suppressing the normal uniaxial lighting pattern"
    isCorrect: false
    rationale: |
      A uniaxial stone examined exactly down its optic axis (the c-axis) would appear
      uniformly dark between crossed polars – it would not show patchy, irregular
      lightening [ref:read-gemmology-3e]. Patchy lightening is specifically the pattern of ADR (anomalous double
      refraction) in cubic minerals, not the pattern of a uniaxial stone viewed down
      its optic axis. Ruby has RI 1.762–1.770 and SG 3.99–4.01 [ref:read-gemmology-3e]; the measured
      RI ~1.75 and SG 3.82 are both below corundum values. Two properties eliminate ruby.
  - text: "Red glass; glass can give a single constant shadow edge and irregular polariscope patterns; the SG of 3.82 is consistent with lead glass used as a ruby simulant"
    isCorrect: false
    rationale: |
      High-lead glass (strass) used as a ruby simulant can achieve SG values up to
      approximately 4.5–5.0 and RI up to approximately 1.70–1.75 depending on composition [ref:read-gemmology-3e].
      SG 3.82 is plausible for heavy glass, but glass would give a perfectly uniform dark
      field on the polariscope (it is amorphous and isotropic) without the patchy ADR
      that characterises strained cubic crystals [ref:read-gemmology-3e]. The patchy lightening is the key
      distinction: ADR in garnet is a structured, crystal-related strain effect; glass
      shows true isotropy.
rationaleCorrect: |
  Almandine garnet (or pyrope-almandine rhodolite) is the correct identification.
  The single constant shadow edge confirms isotropic (cubic) behaviour [ref:read-gemmology-3e]; the RI ~1.75
  and SG 3.82 are consistent with almandine or a pyrope-rich intermediate. The patchy
  polariscope response is anomalous double refraction (ADR) – a strain birefringence
  effect common in cubic garnets, particularly almandine [ref:read-gemmology-3e]. ADR looks like irregular
  patches of light and dark rather than the systematic four-fold lightening of a doubly
  refractive gem. The absence of LWUV fluorescence is typical for iron-bearing garnet [ref:read-gemmology-3e].
  Distinguishing ADR from true double refraction is a key FGA practical skill: rotate
  the stone slowly and observe whether the light/dark pattern is systematic (four positions
  = DR) or irregular and wandering (ADR = garnet) [ref:anderson-gem-testing].

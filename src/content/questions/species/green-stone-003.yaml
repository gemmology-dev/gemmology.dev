id: green-stone-003
stem: |
  A bright yellowish-green faceted stone is tested. Results: RI — no shadow edge on
  the standard refractometer (RI above contact-liquid limit); SG 3.84; polariscope —
  uniformly dark, isotropic; LWUV — moderate orange fluorescence; strong dispersion
  visible as bright coloured flashes when the stone is tilted under a desk lamp.
  The stone is set in a ring described as "demantoid." What is the most likely identity,
  and why does the above-range refractometer reading not indicate diamond?
type: mcq
options:
  - text: "Demantoid garnet (andradite); cubic/isotropic with RI approximately 1.888 (above refractometer range), SG 3.82–3.85, highest dispersion of natural garnets (0.057) — the SG and dispersion confirm demantoid, not diamond (SG 3.52, inert LWUV)"
    isCorrect: true
    rationale: |
      Demantoid (andradite garnet, Ca3Fe2(SiO4)3) is cubic and isotropic with RI
      approximately 1.855–1.900 — well above the standard refractometer limit of ~1.81.
      Its SG of 3.82–3.85 separates it from diamond (SG 3.52 — lighter, not heavier)
      and confirms the garnet identification. The dispersion of 0.057 is the highest
      of any natural garnet and produces vivid fire visible as coloured flashes. Diamond
      has dispersion 0.044 (lower than demantoid) and is inert to LWUV. The orange LWUV
      fluorescence is sometimes seen in demantoid containing chromium, though response
      varies; diamond fluorescence is typically blue LWUV, not orange.
  - text: "Tsavorite garnet (grossular); tsavorite has high RI above the refractometer range and bright green colour similar to demantoid"
    isCorrect: false
    rationale: |
      Tsavorite (green grossular) has RI approximately 1.740–1.760, which IS within the
      standard refractometer range — it gives a clear shadow edge in the 1.740–1.760
      region. Tsavorite does not exceed the refractometer limit. Additionally, tsavorite
      SG is approximately 3.57–3.73, clearly lower than the measured 3.84. Tsavorite
      dispersion is also lower than demantoid. A student who knows both are green garnets
      might confuse them, but the measurable RI (tsavorite on scale, demantoid off scale)
      and SG values separate them definitively.
  - text: "Diamond; colourless diamonds can appear green from colouring inclusions, and the above-range RI and isotropic behaviour both confirm diamond"
    isCorrect: false
    rationale: |
      Diamond SG is 3.52, clearly below the measured 3.84. Diamond dispersion is 0.044,
      lower than the dramatic fire described (consistent with demantoid's 0.057). Diamond
      is inert to LWUV (or shows blue LWUV fluorescence) — orange LWUV is not a diamond
      response. While diamond is isotropic and above the refractometer range (confirming
      those two observations), the SG eliminates it: at SG 3.84, the stone is denser
      than diamond. The "no refractometer reading + isotropic" combination does not
      uniquely identify diamond — any high-RI isotropic material (including garnets) fits.
      The SG is the decisive test.
rationaleCorrect: |
  Demantoid identification relies on the combination of: (1) above-range refractometer
  (RI ~1.89, beyond contact-liquid limit); (2) cubic/isotropic on polariscope; (3) SG
  3.82–3.85 — heavier than diamond (3.52), which is a key discriminator; (4) high
  dispersion producing vivid fire (0.057, higher than diamond's 0.044); (5) characteristic
  "horsetail" inclusions under the microscope — byssolite/actinolite fibres radiating from
  a chromite crystal, virtually diagnostic for demantoid. The absence of a refractometer
  reading is often the first clue: always go to SG and microscopy next when the
  refractometer gives no reading on a green isotropic stone.

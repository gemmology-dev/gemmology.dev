id: ri-reading-006
stem: |
  A student examines a faceted stone on the refractometer. Two shadow edges appear,
  both constant throughout a full rotation, and they remain parallel to each other
  with no movement at all. The student records the two fixed readings as 1.544 and
  1.553. What Sturman pattern is this, and why can the optic sign NOT be determined
  from this facet?
type: mcq
options:
  - text: "Pattern II; c-axis is perpendicular to the table facet, so only omega and epsilon are read as fixed values but sign cannot be determined without testing another facet"
    isCorrect: true
    rationale: |
      Pattern II shows exactly two constant, parallel shadow edges that do not move
      during rotation. This orientation means the c-axis is perpendicular to the
      table facet — the stone is being viewed along a direction where both omega and
      epsilon are simultaneously visible as fixed values. Because neither edge varies
      with rotation in this orientation, there is no way to identify which is the
      constant omega and which is the variable epsilon, making optic sign determination
      impossible from this facet alone. The readings 1.544 and 1.553 confirm quartz.
  - text: "Pattern III; c-axis is parallel to the table, and the optic sign is determinable as positive"
    isCorrect: false
    rationale: |
      Pattern III requires one constant and one variable edge that touch at one point.
      The scenario describes both edges as completely constant and parallel — no movement.
      This is the opposite of Pattern III, where one edge moves. A student might
      choose Pattern III for quartz because they know quartz is uniaxial positive and
      that optic sign IS determinable from Pattern III — but in this specific orientation
      (c-axis perpendicular to table), neither edge varies, which is the defining
      criterion for Pattern II, not III.
  - text: "Pattern I; the stone is isotropic with two internal stress cracks producing two readings"
    isCorrect: false
    rationale: |
      Pattern I produces only one shadow edge. Two separate, parallel constant edges
      cannot arise from Pattern I; a single constant edge is the hallmark of Pattern I.
      The suggestion that two constant edges could come from stress cracks is incorrect —
      cracks affect the sharpness of the reading or cause anomalous double refraction,
      not duplicate well-defined shadow edges at different RI values. Two constant
      edges separated by a measurable interval are diagnostic of Pattern II, not an
      artefact.
rationaleCorrect: |
  Pattern II is the only Sturman pattern with two constant, parallel, non-moving shadow
  edges. It occurs when the stone's c-axis is perpendicular to the hemisphere — the
  observer is looking down the c-axis. The birefringence can be calculated (1.553 − 1.544
  = 0.009, confirming quartz), but the optic sign cannot be read because neither edge
  is variable; you cannot identify which value is omega and which is epsilon from this
  pattern alone. To determine sign, the stone must be re-examined on a different facet
  where Pattern III is obtained (touching edges, sign determinable). This is a critical
  distinction: knowing the birefringence does not tell you the sign.
difficulty: 4

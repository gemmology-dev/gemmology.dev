id: ri-reading-009
stem: |
  A student examines a faceted yellowish-green stone and records Sturman Pattern VII:
  two shadow edges that both move during rotation and touch each other at one point.
  The edges range from 1.619 to 1.627. Using the biaxial optic sign rule for Pattern VII,
  the student identifies that the edge crossing the midpoint between alpha and gamma
  corresponds to beta = 1.622. Given that beta is closer to alpha (1.619) than to
  gamma (1.627), what is the optic sign?
type: mcq
options:
  - text: "Biaxial positive, because beta is closer to alpha than to gamma"
    isCorrect: true
    rationale: |
      For biaxial gems, the optic sign is determined by the position of beta relative
      to alpha and gamma: if beta is closer to alpha, the stone is biaxial positive;
      if beta is closer to gamma, it is biaxial negative. Here beta = 1.622, alpha =
      1.619, gamma = 1.627. Distance from alpha = 0.003; distance from gamma = 0.005.
      Beta is closer to alpha, so the stone is biaxial positive. RI range 1.619–1.627
      with beta ~1.622 is consistent with topaz (orthorhombic, biaxial positive).
  - text: "Biaxial negative, because beta is closer to alpha than to gamma"
    isCorrect: false
    rationale: |
      The rule is the opposite: biaxial negative means beta is closer to gamma (the
      higher RI value), not alpha. Choosing "negative" here applies the rule in reverse.
      A student who has learned "beta closer to alpha = negative" has inverted the
      mnemonic. The correct association is: biaxial positive = beta close to alpha
      (the minimum, alpha end); biaxial negative = beta close to gamma (the maximum).
      This is one of the most commonly reversed rules in FGA optical property testing.
  - text: "The optic sign cannot be determined from Pattern VII without a conoscope"
    isCorrect: false
    rationale: |
      Pattern VII — two variable edges that touch — is specifically the pattern from
      which biaxial optic sign CAN be read directly from the refractometer, without
      a conoscope. The student correctly identifies Pattern VII and measures the three
      RI values (alpha, beta, gamma), which is exactly the information needed to apply
      the beta-position rule. Pattern VI (two variable, not touching) is the pattern
      where sign cannot be determined from the refractometer; choosing this answer
      confuses VI and VII.
rationaleCorrect: |
  Pattern VII gives two moving edges that touch at one rotation position, allowing
  all three RI values (alpha, beta, gamma) to be read from the refractometer. The
  optic sign is then determined by beta's position: beta close to alpha = biaxial
  positive; beta close to gamma = biaxial negative. Here: alpha 1.619, beta 1.622,
  gamma 1.627. Beta is 0.003 from alpha and 0.005 from gamma — closer to alpha,
  therefore biaxial positive. Topaz (orthorhombic, biaxial positive) fits the RI
  range. The common error is inverting the rule. A useful anchor: "alpha is the
  minimum — biaxial positive means beta pulls toward the minimum end."

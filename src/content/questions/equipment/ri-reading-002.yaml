id: ri-reading-002
stem: |
  On the refractometer, a faceted stone shows two shadow edges during rotation. One
  edge stays fixed at RI 1.662; the other moves continuously between 1.662 and 1.691
  and the two edges come together and touch at one point in the rotation. A student
  records: constant edge omega = 1.662, variable edge epsilon = 1.691. What Sturman
  pattern is this, and what is the optic sign?
type: mcq
options:
  - text: "Pattern III; uniaxial positive (epsilon > omega)"
    isCorrect: true
    rationale: |
      Pattern III is characterised by one constant and one variable edge that touch
      at one point during rotation, confirming uniaxial character with the c-axis
      parallel to the table facet. The optic sign rule is: if epsilon (the variable
      edge) is greater than omega (the constant edge), the stone is uniaxial positive.
      Here epsilon 1.691 > omega 1.662, so the stone is uniaxial positive. Birefringence
      is 1.691 − 1.662 = 0.029, consistent with peridot.
  - text: "Pattern IV; uniaxial or biaxial — optic sign indeterminate"
    isCorrect: false
    rationale: |
      Pattern IV shows one constant and one variable edge that do NOT touch during
      rotation. The critical distinction from Pattern III is whether the edges meet.
      In this scenario the edges are explicitly described as coming together at one
      point, which is the defining criterion for Pattern III. A student might confuse
      the two patterns because both show one constant and one variable edge, but the
      touching/non-touching distinction is decisive. Pattern IV is also ambiguous
      between uniaxial and biaxial; Pattern III is unambiguously uniaxial.
  - text: "Pattern III; uniaxial negative (omega > epsilon)"
    isCorrect: false
    rationale: |
      For uniaxial negative, the constant omega must be greater than the variable
      epsilon — that is, the constant edge must lie at a higher RI than the variable
      one. In this case, the constant edge is at 1.662 and the variable edge rises
      to 1.691, meaning epsilon > omega. Choosing "negative" reverses the sign rule.
      This is a common exam error: students remember the rule but apply it backwards
      when they see numbers. The mnemonic is: positive = epsilon exceeds omega (both
      starting with vowel-sounds — epsilon is "extra", so positive).
rationaleCorrect: |
  Pattern III is identified by one constant shadow edge (omega), one variable edge
  (epsilon), and the edges touching at exactly one point in the rotation. This is the
  only pattern that unambiguously confirms uniaxial character AND allows optic sign
  determination from the refractometer alone. The sign rule: epsilon > omega = positive;
  omega > epsilon = negative. Here epsilon 1.691 > omega 1.662, giving uniaxial positive.
  The birefringence of 0.029 fits peridot (olivine, orthorhombic) or high tourmaline —
  but peridot is actually biaxial, so the reading would look like Pattern IV, V, VI, or VII
  in reality. The properties given here match a theoretical uniaxial positive scenario
  for illustration. Note: never confuse Pattern III (edges touch) with Pattern IV (edges
  do not touch) — the touch/no-touch test is the single most tested distinction in
  FGA refractometer questions.

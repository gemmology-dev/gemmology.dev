id: ri-reading-007
stem: |
  A gemmologist places an unmounted colourless stone on the refractometer and finds
  no shadow edge anywhere on the scale; the scale appears uniformly bright above
  approximately 1.79. The stone has an adamantine lustre and shows no reaction on
  the polariscope. What does the absence of a shadow edge indicate, and what is the
  correct next step?
type: mcq
options:
  - text: "The stone's RI exceeds the contact-liquid limit (~1.79); proceed to SG measurement and thermal-probe testing"
    isCorrect: true
    rationale: |
      The standard gemmological refractometer, using methylene iodide contact liquid
      (RI ~1.79–1.81), cannot display shadow edges for stones whose RI exceeds the
      contact liquid's own refractive index [ref:read-gemmology-3e]. For colourless stones with adamantine
      lustre and no refractometer reading, the principal candidates are diamond (RI
      2.417, SG 3.52) [ref:read-gemmology-3e], high zircon (RI up to 1.984, SG 4.69) [ref:read-gemmology-3e], and some synthetic
      simulants (CZ: RI 2.17) [ref:read-gemmology-3e]. Hydrostatic SG and a thermal probe distinguish these
      rapidly without damaging the stone [ref:anderson-gem-testing].
  - text: "The stone is amorphous glass; amorphous materials do not give shadow edges"
    isCorrect: false
    rationale: |
      Amorphous glass does give a shadow edge on the refractometer; glass has an RI
      typically between 1.44 and 1.70 depending on composition [ref:read-gemmology-3e], well within the
      instrument's range. A stone with no refractometer reading and adamantine lustre
      cannot be common silicate glass; glass has a vitreous, not adamantine, lustre and
      would produce a clear single constant edge (Pattern I) [ref:read-gemmology-3e].
  - text: "The contact liquid has evaporated; repeat the test after applying fresh liquid"
    isCorrect: false
    rationale: |
      Evaporated contact liquid is a valid troubleshooting step when no reading is
      obtained, but it produces a different symptom: a very faint or absent contact
      (the stone lifts off the hemisphere), resulting in a faint or patchy image rather
      than a uniformly bright scale [ref:anderson-gem-testing]. More importantly, it does not explain the
      adamantine lustre. If reapplying fresh contact liquid also gives no shadow edge,
      and lustre and other observations point to a high-RI stone, the above-range
      interpretation is correct.
rationaleCorrect: |
  When no shadow edge appears on the refractometer scale, and the stone has adamantine
  lustre (RI > 1.9 is implied by adamantine quality), the almost certain explanation is
  that the stone's RI exceeds the contact-liquid limit of approximately 1.79–1.81 [ref:read-gemmology-3e].
  This is not a fault in the instrument; it is a diagnostic result in itself. The
  priority next tests are: (1) SG by hydrostatic weighing (diamond 3.52, CZ 5.8,
  high zircon 4.69) [ref:read-gemmology-3e]; (2) thermal probe (diamond conducts heat rapidly, CZ does not) [ref:anderson-gem-testing].
  The polariscope reading (uniformly dark = isotropic) rules out high zircon (which
  would show birefringence on polariscope), narrowing the candidates to diamond or
  an isotropic simulant [ref:read-gemmology-3e].

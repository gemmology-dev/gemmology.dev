id: inclusion-negative-crystal-001
stem: |
  A gemmologist examines a blue spinel under the microscope and observes small, regular,
  multi-faceted cavities within the stone. Each cavity has the geometric form of a
  regular octahedron — eight triangular faces meeting at precise angles. The cavities
  appear either empty (filled with air, showing total internal reflection at their faces)
  or partially filled with liquid. A student labels these as "diamond-shaped crystal
  inclusions." What is the correct term for these features, and why do they have an
  octahedral shape?
type: mcq
options:
  - text: "Negative crystals; the cavities have an octahedral form because spinel (cubic, m3̄m point group) has octahedral habit as its characteristic crystal form — the void takes the shape of the host crystal's symmetry"
    isCorrect: true
    rationale: |
      Negative crystals are fluid-filled or empty cavities that have the geometric shape
      of the host mineral's own crystal form. Spinel is cubic (point group m3̄m) and
      crystallises characteristically as octahedra — so cavities that formed by
      dissolution or incomplete crystal growth within spinel take on the octahedral
      habit. The octahedral shape is an expression of the host crystal's symmetry and
      bond strengths — the surfaces of the cavity form along the {111} crystal faces,
      which represent the low-surface-energy planes of the cubic structure. Calling
      them "diamond-shaped" is colloquially used by non-specialists but is incorrect
      gemmological terminology.
  - text: "Fluid inclusions; the octahedral shape indicates the trapped fluid crystallised into an octahedral halite crystal, similar to three-phase inclusions in emerald"
    isCorrect: false
    rationale: |
      Halite (NaCl) crystallises in the cubic system with a cube habit — cubic (isometric)
      halite forms cubes, not octahedra. More importantly, what the student describes
      are not solid halite crystals but geometric voids (cavities) with the spinel crystal
      form. The distinction between a negative crystal (a void with host-crystal form)
      and a three-phase inclusion (a cavity containing liquid + gas + solid daughter
      crystal) is fundamental. Confusing the octahedral shape with "crystallised halite"
      misidentifies both the shape (cube vs. octahedron) and the nature of the feature
      (solid daughter crystal vs. an empty/fluid-filled void).
  - text: "Cleavage voids; the octahedral faces of the cavities are {111} cleavage planes in spinel, which have opened up to form empty octahedral cleavage-bounded cavities"
    isCorrect: false
    rationale: |
      Spinel does have imperfect octahedral cleavage on {111}, but cleavage voids would
      appear as flat, irregular planar gaps rather than perfect multi-faced enclosed
      cavities. True octahedral negative crystals are enclosed geometric forms with all
      eight faces meeting cleanly — they are not cleavage features, which are planar and
      open-ended. The distinction is important: cleavage affects the gem's durability and
      is usually visible as flat planes extending to or toward the surface; negative
      crystals are enclosed internal voids with no connection to the surface.
rationaleCorrect: |
  Negative crystals in spinel are one of the classic microscopic features of this species
  and are also seen in other cubic gems (diamond, garnet) and in non-cubic gems where the
  void shape reflects the host crystal symmetry. In spinel (cubic, octahedral habit),
  negative crystals take the octahedral form. They may be empty (showing total internal
  reflection at the {111} faces, giving them a mirror-bright appearance) or partially
  filled with residual fluid. Their presence is a natural origin indicator — synthetic
  spinel (flame fusion or hydrothermal) rarely if ever shows perfect natural negative
  crystals of this kind, though synthetic material may show other growth features. The
  term "negative crystal" is standard in gemmological and mineralogical literature;
  students should recognise it and be able to explain the shape relationship to the host
  crystal's habit.
difficulty: 3

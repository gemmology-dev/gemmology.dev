id: inclusion-three-phase-001
stem: |
  Under darkfield illumination, a gemmologist examines a deeply saturated green
  cabochon and observes an irregular, jagged fluid-filled cavity. Inside the cavity,
  there is a clearly visible mobile gas bubble that moves when the stone is tilted,
  and a small cuboid solid crystal sitting in the liquid. The gemmologist considers
  three possible identifications for the stone: Colombian emerald, Zambian emerald,
  and synthetic flux-grown emerald. Which identification does the inclusion support,
  and what are the three phases described?
type: mcq
options:
  - text: "Colombian emerald; the three-phase inclusion (liquid + mobile gas bubble + solid cuboid crystal — halite, NaCl) is virtually diagnostic of Colombian origin; Zambian emerald shows two-phase inclusions (no solid crystal); synthetic flux-grown emerald shows flux fingerprints and wispy inclusions, not three-phase halite inclusions"
    isCorrect: true
    rationale: |
      The three phases are: (1) liquid (saline solution, predominantly NaCl brine);
      (2) gas — a mobile CO2 bubble that moves freely when the stone is tilted;
      (3) solid — a small cuboid (cubic) crystal of halite (NaCl) [ref:gubelin-koivula-vol1]. The cuboid habit
      of the solid crystal is diagnostic: halite crystallises in the cubic system and
      produces perfect cube-shaped crystals [ref:read-gemmology-3e]. This exact combination — irregular jagged
      cavity (reflecting the host rock environment), saline fluid, CO2 bubble, and
      halite cube — is characteristic of Colombian emerald from the sedimentary-hosted
      deposits of Muzo, Chivor, and Coscuez [ref:gubelin-koivula-vol1]. Zambian emerald (hosted in schist) shows
      a different inclusion suite dominated by two-phase inclusions without halite [ref:gubelin-koivula-vol1].
  - text: "Synthetic flux-grown emerald; the three-phase inclusion is characteristic of flux-grown material where the flux solidifies as a cube-shaped crystal inside the void"
    isCorrect: false
    rationale: |
      Flux-grown synthetic emerald does not produce three-phase inclusions with a cuboid
      NaCl crystal [ref:gubelin-koivula-vol1]. Flux inclusions in synthetic emerald appear as wispy, irregular,
      feather-like or needle-like concentrations of the molten flux that were trapped
      during growth [ref:read-gemmology-3e]. The flux used (typically lithium molybdate or lead oxide-based
      fluxes) crystallises as irregular masses or is vitreous (glassy), not as perfect
      cubes [ref:read-gemmology-3e]. The cuboid shape of the solid in the described inclusion is characteristic
      of halite, which is geologically formed — not from a synthetic flux medium [ref:gubelin-koivula-vol1]. Synthetic
      emerald inclusions are fundamentally different in appearance from Colombian three-phase
      inclusions.
  - text: "Zambian emerald; Zambian emeralds commonly show three-phase inclusions with halite cubes from the saline formation environment in Zambia"
    isCorrect: false
    rationale: |
      Zambian emerald is hosted in metasomatic schist (Kafubu/Kagem deposit) and forms
      in a different geochemical environment from Colombia [ref:gubelin-koivula-vol1]. Zambian emeralds show
      predominantly two-phase inclusions (liquid + gas bubble) and solid inclusions
      (biotite, actinolite, dolomite, pyrite), but NOT three-phase inclusions with
      halite cubes [ref:gubelin-koivula-vol1]. The NaCl-rich three-phase inclusions are linked to the Colombian
      geological setting where emeralds formed in an evaporite-bearing sedimentary
      environment with saline fluids [ref:read-gemmology-3e]. This is a key geographic origin distinction
      tested in the FGA examination.
rationaleCorrect: |
  Three-phase inclusions containing a cuboid halite crystal are virtually diagnostic of
  Colombian emerald origin [ref:gubelin-koivula-vol1] — this is one of the most celebrated and reliably
  diagnostic features in gemmology. The three phases are: liquid (saline NaCl solution),
  gas (CO2 bubble, mobile), and solid (halite cube in cubic habit) [ref:gubelin-koivula-vol1]. The irregular,
  jagged cavity walls reflect the surrounding rock fabric. When present, this inclusion type
  alone provides compelling evidence for Colombian origin; it is not found in Zambian,
  Brazilian, or synthetic emeralds [ref:gubelin-koivula-vol1]. The Colombian geological setting — where emeralds
  formed in hydrothermal veins cutting through halite-rich black shales — explains the
  saline inclusion chemistry [ref:read-gemmology-3e].

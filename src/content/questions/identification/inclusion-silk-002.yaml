id: inclusion-silk-002
stem: |
  A student examines two blue sapphire cabochons from different origins under the
  microscope. Stone A (described as Sri Lankan/Ceylon) shows long, prominent, clearly
  separated rutile needles extending across the full field of view and intersecting
  at 60°. Stone B (described as Burmese, Mogok) shows very fine, short, densely packed
  needles that give the stone a soft, slightly hazy appearance. Which description
  matches which origin, and what trade term is used for Stone B's appearance?
type: mcq
options:
  - text: "Stone A is Sri Lankan (long, prominent needles); Stone B is Burmese Mogok (fine, dense, short needles producing the 'velvety' or 'sleepy' appearance valued in fine Burmese ruby and sapphire)"
    isCorrect: true
    rationale: |
      Sri Lankan (Ceylon) corundums typically show longer, more widely spaced, prominent
      rutile needles that are easily visible individually under the microscope and often
      produce strong asterism in asteriated stones [ref:gubelin-koivula-vol1]. Burmese Mogok corundums show much
      finer, denser, shorter needles — so fine that they scatter light to produce a soft,
      slightly diffused glow called "velvety" or "sleepy" appearance [ref:gubelin-koivula-vol1]. This velvet effect
      is associated with the finest Burmese stones and is one of the visual qualities
      gemmologists look for in premium rubies and sapphires. The silk characteristics
      are an origin indicator, though not conclusive on their own [ref:read-gemmology-3e].
  - text: "Stone A is Burmese Mogok (long needles for maximum asterism); Stone B is Sri Lankan (fine needles for clarity)"
    isCorrect: false
    rationale: |
      The origin descriptions are reversed. Mogok Burmese corundums are known for their
      fine, delicate silk — not long, prominent needles [ref:gubelin-koivula-vol1]. Long, clearly separated needles
      producing strong asterism are more characteristic of Sri Lankan material. Asterism
      in Burmese star rubies does occur, but the silk type that produces the prized
      "velvety" quality in non-asteriated Mogok stones is fine and dense [ref:gubelin-koivula-vol1].
  - text: "Both stones are Kashmir sapphire; Kashmir sapphires show fine silk in all specimens, and 'velvety' is the exclusive Kashmir descriptor"
    isCorrect: false
    rationale: |
      The velvety appearance of Kashmir sapphire is caused by a different mechanism
      from rutile silk: Kashmir sapphires contain extremely fine, microscopic particles
      (not classic rutile needles at 60°) that scatter light, producing the famous
      velvety or sleepy appearance [ref:gubelin-koivula-vol1]. The term "velvety" is most associated with Kashmir,
      but fine Burmese silk can produce a similar soft quality. The question describes
      two stones with classic rutile silk at 60° intersections — this matches Burmese
      and Sri Lankan origin, not Kashmir. Kashmir sapphire has a different inclusion
      suite with specific tourmaline inclusions and zircon halos alongside the fine
      particulate scattering [ref:gubelin-koivula-vol1].
rationaleCorrect: |
  Silk characteristics in corundum are origin indicators because the geological environment
  of crystallisation controls rutile exsolution [ref:gubelin-koivula-vol1]. Mogok Burmese corundum forms in a
  marble-hosted environment with relatively slow cooling, producing fine, dense, short
  needles. Sri Lankan placer corundums originate from a different geological context
  (high-temperature metamorphic, alluvial) and show longer, more prominent needles [ref:gubelin-koivula-vol1].
  The "velvety" trade descriptor for fine Burmese and Kashmir stones refers to this
  light-scattering silk effect [ref:read-gemmology-3e]. For a complete origin determination, silk character is
  combined with other microscopic features, UV fluorescence, spectroscopy, and where
  required, trace-element geochemistry. Silk alone is not conclusive for origin [ref:read-gemmology-3e].

id: phys-prop-010
stem: |
  During a practical, a student is handed a translucent white to pale-blue cabochon
  and asked to identify it. The stone weighs 1.42 g in air and 0.95 g in water
  (SG = 3.02). The spot reading on the refractometer gives approximately 1.53. The
  stone shows a strong adularescence (floating blue sheen) when rotated under a
  directional light source. No fluorescence under UV. Which species is this, and
  which near-miss species does the adularescence immediately eliminate?
type: mcq
options:
  - text: "Moonstone (orthoclase feldspar), adularescence from light scattering between albite lamellae; the optical phenomenon eliminates white chalcedony and milky quartz, which show no adularescence"
    isCorrect: true
    rationale: |
      Adularescence — the floating blue-white sheen caused by light scattering between
      alternating layers of orthoclase and albite — is virtually diagnostic for moonstone
      (adularia/orthoclase feldspar) [ref:read-gemmology-3e]. The SG of 3.02 is above the normal orthoclase
      range of 2.56–2.59, suggesting this might be a high-SG variety or include a
      measurement error; however, the spot RI ~1.53 (orthoclase RI ~1.52–1.54) [ref:read-gemmology-3e] and
      adularescence together strongly indicate moonstone. White chalcedony (SG 2.58–2.64,
      RI 1.535) and milky quartz (SG 2.65, RI 1.544) both lack adularescence [ref:read-gemmology-3e].
  - text: "Peristerite (plagioclase feldspar showing adularescence), SG 2.62–2.65, RI 1.53–1.55; the properties are consistent with plagioclase, not orthoclase"
    isCorrect: false
    rationale: |
      Peristerite is an albite-rich plagioclase that can show adularescence (sometimes
      called "rainbow moonstone" in the trade, though this is a misnomer) [ref:read-gemmology-3e]. Peristerite
      SG is typically 2.62–2.65 and RI approximately 1.53–1.55 — overlapping partially
      with orthoclase. The measured SG of 3.02 is too high for peristerite; distinguishing
      peristerite from orthoclase moonstone requires precise RI measurement and spectroscopy,
      not the spot method.
  - text: "Labradorite (plagioclase feldspar), SG 2.69–2.72, RI 1.56–1.57; labradorescence is the same phenomenon as adularescence"
    isCorrect: false
    rationale: |
      Labradorescence (the spectral colour play of labradorite) and adularescence
      (the floating blue sheen of moonstone) are related but distinct phenomena [ref:read-gemmology-3e].
      Both involve thin-film interference or scattering between exsolution lamellae,
      but the result differs: adularescence is a floating, mobile blue-white glow;
      labradorescence produces vivid spectral colours (blues, greens, golds) that
      change with angle. Labradorite SG 2.69–2.72 and RI 1.56–1.57 [ref:read-gemmology-3e] are also clearly
      different from the measured values.
rationaleCorrect: |
  Moonstone (adularia/orthoclase feldspar) is identified by its adularescence — a
  floating blue-white sheen caused by Rayleigh scattering from submicroscopic albite
  lamellae exsolved within the orthoclase host [ref:read-gemmology-3e]. This optical effect is specific to
  moonstone among common gem feldspars and distinguishes it from quartz-group stones
  (which do not show adularescence) and labradorite (which shows labradorescence —
  spectral colour play, visually distinct) [ref:read-gemmology-3e]. SG ~2.56–2.59 for pure orthoclase; RI
  1.518–1.526 (alpha) to 1.524–1.533 (gamma), mean ~1.52–1.53 [ref:read-gemmology-3e]. The spot reading of
  ~1.53 is consistent. Note: "rainbow moonstone" in the trade is often labradorite,
  not orthoclase moonstone — the trade name is misleading [ref:read-gemmology-3e].

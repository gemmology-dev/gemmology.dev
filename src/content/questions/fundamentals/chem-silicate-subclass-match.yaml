id: chem-silicate-subclass-match

stem: |
  Match each species to its correct silicate structural subclass (or, for one of them, its
  non-silicate class). Think about how the SiO4 tetrahedra (if present) are linked together.

type: matching

pairs:
  - left: "Beryl"
    right: "Cyclosilicate (ring)"
  - left: "Zircon"
    right: "Nesosilicate (isolated tetrahedra)"
  - left: "Jadeite"
    right: "Inosilicate (single chain)"
  - left: "Turquoise"
    right: "Phosphate (not a silicate)"

rationaleCorrect: |
  Beryl's Be3Al2Si6O18 formula is built of six-membered [Si6O18] rings — a cyclosilicate.
  Zircon's ZrSiO4 has isolated SiO4 tetrahedra sharing no oxygens with each other — a
  nesosilicate, the same class as garnet and topaz. Jadeite, NaAlSi2O6, is a pyroxene: a
  single-chain inosilicate, distinct from double-chain amphiboles like nephrite's
  tremolite-actinolite. Turquoise, CuAl6(PO4)4(OH)8·4H2O, contains no SiO4 tetrahedra at all —
  it is a phosphate, a completely different chemical class from every silicate in this list.
  The classic trap is assuming any gem with "silica-adjacent" hardness or lustre must be a
  silicate, or mixing up which chain-silicate group (pyroxene vs. amphibole) is single- versus
  double-chain.


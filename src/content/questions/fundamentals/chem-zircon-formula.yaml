id: chem-zircon-formula

stem: |
  Asked to write zircon's formula, a candidate answers "ZrO2, since zircon is basically a
  zirconium oxide." Give the correct formula that shows why this answer is wrong.

type: fill-blank

acceptedAnswers:
  - "ZrSiO4"
  - "ZrSiO₄"
  - "zrsio4"
  - "Zr[SiO4]"
  - "Zr(SiO4)"

rationaleCorrect: |
  Zircon is ZrSiO4, a nesosilicate built of isolated SiO4 tetrahedra bonded to zirconium — it
  is not an oxide, and silicon is an essential part of the formula, not absent from it. ZrO2
  (zirconia) is a completely different substance: the raw material behind the diamond simulant
  cubic zirconia, which is never found as gem-quality natural zircon. Confusing the two is a
  common trap because both contain zirconium and both can be near-colourless faceted stones.


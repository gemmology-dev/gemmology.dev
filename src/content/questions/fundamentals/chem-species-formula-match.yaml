id: chem-species-formula-match

stem: |
  Match each gem species to its correct chemical formula. Two of these species are pure oxides
  with no silicon at all, and the other two are silicates — sort carefully.

type: matching

pairs:
  - left: "Diamond"
    right: "C"
  - left: "Corundum"
    right: "Al2O3"
  - left: "Beryl"
    right: "Be3Al2Si6O18"
  - left: "Spinel"
    right: "MgAl2O4"

rationaleCorrect: |
  Diamond is pure carbon (C), crystallising in the isometric system. Corundum (Al2O3) and
  spinel (MgAl2O4) are both oxides — neither contains silicon, despite both being common,
  hard, gem-quality minerals often mentally grouped with "silicate" gems. Beryl (Be3Al2Si6O18)
  is the odd one out chemically: a cyclosilicate built of six-membered [Si6O18] rings. The
  most common matching error is pairing corundum or spinel with a silicate-style formula out
  of habit, or crediting chrysoberyl's oxide formula (BeAl2O4) to beryl because both contain
  beryllium.

difficulty: 2


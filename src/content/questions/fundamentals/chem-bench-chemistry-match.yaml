id: chem-bench-chemistry-match

stem: |
  Match each bench-relevant material or phenomenon to the chemical process or composition that
  explains it. These are the kinds of facts examiners expect you to connect treatment history,
  simulant identity, and diamond type.

type: matching

pairs:
  - left: "Beryllium-diffused corundum"
    right: "Be2+ driven into the lattice at >1800°C"
  - left: "Cubic zirconia (CZ)"
    right: "Yttria- or calcia-stabilized ZrO2"
  - left: "Moissanite"
    right: "Silicon carbide (SiC)"
  - left: "Type IIb diamond"
    right: "Boron impurities, no measurable nitrogen"

rationaleCorrect: |
  Beryllium diffusion treatment works by driving the very small Be2+ ion into the corundum
  lattice at temperatures above 1800°C, altering trace-element colour chemistry to create or
  modify yellow, orange and brown components (and, since it was first recognised in 2002, a
  wider range of corundum colours). Cubic zirconia is zirconium dioxide (ZrO2) that must be
  chemically stabilized, typically with yttria or calcia, to keep its high-temperature cubic
  form stable at room temperature — pure, unstabilized ZrO2 reverts to a monoclinic structure
  on cooling. Moissanite is silicon carbide (SiC); although marketed as a lab-created diamond
  simulant, SiC has also been confirmed, in at least one specimen, as a genuine (very rare)
  rock-forming natural mineral. Type IIb diamonds contain no measurable nitrogen but do
  contain boron impurities, which cause both their blue colour and their semiconducting
  properties — the opposite impurity profile from the nitrogen-bearing Type Ia/Ib diamonds.


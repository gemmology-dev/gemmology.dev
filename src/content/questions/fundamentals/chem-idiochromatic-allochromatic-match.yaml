id: chem-idiochromatic-allochromatic-match

stem: |
  Match each species to its correct colour-mechanism classification: idiochromatic (the
  colouring cation is an essential part of the mineral's own formula) or allochromatic (the
  colour comes from a trace impurity in an otherwise colourless or differently coloured host).

type: matching

pairs:
  - left: "Corundum (ruby/sapphire)"
    right: "Allochromatic"
  - left: "Beryl (emerald/aquamarine)"
    right: "Allochromatic"
  - left: "Quartz (amethyst)"
    right: "Allochromatic"
  - left: "Turquoise"
    right: "Idiochromatic"

rationaleCorrect: |
  Corundum is colourless as pure Al2O3; every gem colour it shows (ruby's red, every sapphire
  hue) is produced by trace Cr, Fe and Ti impurities, making it a classic allochromatic
  mineral. Beryl is the same story: colourless goshenite is pure Be3Al2Si6O18, while emerald,
  aquamarine and morganite owe their colours to different trace cations riding in the same
  host. Quartz is likewise allochromatic — amethyst's purple comes from an iron-related colour
  centre (a hole trapped on substitutional Fe3+, converting it to Fe4+), not from silicon or
  oxygen. Turquoise is different in kind: its blue-forming Cu2+ is written directly into its
  own formula, CuAl6(PO4)4(OH)8·4H2O, so it is idiochromatic. The classic trap is assuming
  common trace elements (like chromium in both ruby and emerald) make a mineral idiochromatic
  because the colour "feels" intrinsic — idiochromatic refers strictly to whether the ion is
  part of the formula, not how vivid or characteristic the colour is.


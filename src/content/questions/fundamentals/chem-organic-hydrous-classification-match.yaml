id: chem-organic-hydrous-classification-match

stem: |
  Match each material to the chemical/structural class that best describes it. Not everything
  a jeweller sells is a single-phase crystalline mineral.

type: matching

pairs:
  - left: "Amber"
    right: "Organic (fossilized resin, not a true mineral)"
  - left: "Common opal"
    right: "Hydrous, largely non-crystalline silica"
  - left: "Pearl / nacre"
    right: "Biogenic composite (aragonite + conchiolin protein)"
  - left: "Corundum"
    right: "Crystalline oxide (contrast case)"

rationaleCorrect: |
  Amber is fossilized tree resin — an organic gem material, not a mineral in the strict
  crystallographic sense. Common opal is SiO2·nH2O, hydrous and largely non-crystalline
  (opal-A) or poorly ordered (opal-CT/opal-C), fundamentally different from crystalline
  quartz despite sharing the same silica chemistry. Pearl and nacre are biogenic composites:
  aragonite (a CaCO3 polymorph) platelets bound together by the organic protein conchiolin,
  not a single-phase mineral at all. Corundum is included as a contrast case — a fully
  crystalline oxide with none of the organic, hydrous or biogenic complications of the other
  three, useful for testing whether a candidate can tell "gem material" apart from "mineral
  species" in the strict sense.


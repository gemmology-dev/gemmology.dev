id: crystal-system-005
stem: |
  A student is shown a rough crystal with clearly developed faces and asked to identify
  its crystal system from the morphology alone. The crystal has three pairs of equivalent
  pinacoid faces meeting at exactly 90° on all edges, but the three pairs of faces are
  all different sizes (a ≠ b ≠ c axes are unequal in length). No other faces are present.
  What crystal system does this morphology indicate?
type: mcq
options:
  - text: "Orthorhombic; three unequal axes all at 90° is the defining geometry of orthorhombic"
    isCorrect: true
    rationale: |
      The orthorhombic system is defined by three mutually perpendicular crystallographic
      axes (all inter-axial angles = 90°) with all three axes of different lengths
      (a ≠ b ≠ c) [ref:read-gemmology-3e]. A crystal with three pairs of rectangular faces, all meeting at right
      angles but of different sizes, perfectly expresses this geometry. The tetragonal
      system also has all right angles but requires two axes of equal length (a = b ≠ c),
      which would produce two identical pairs of faces and one different pair – not three
      different pairs [ref:read-gemmology-3e]. Cubic requires all three axes equal.
  - text: "Tetragonal; tetragonal crystals have three axes at 90° and commonly show different face sizes"
    isCorrect: false
    rationale: |
      Tetragonal crystals have two equal horizontal axes and one unique vertical axis
      (a = b ≠ c), with all three axes at 90° [ref:read-gemmology-3e]. This means the four faces parallel to
      the a and b axes are equivalent, producing only two pairs of different face sizes –
      not three pairs as described. If all three pinacoid pairs are different sizes, the
      two horizontal axes cannot be equal, which rules out tetragonal.
  - text: "Cubic; the 90° inter-axial angles and pairs of opposite faces confirm cubic symmetry"
    isCorrect: false
    rationale: |
      Cubic crystals have all three axes equal in length (a = b = c) at 90° [ref:read-gemmology-3e]. This means
      all six faces of a simple cubic form (the cube) are identical in size. If the three
      face pairs are all different sizes (implying unequal axes), the crystal cannot be
      cubic. Cubic gem crystals (garnet octahedra, spinel octahedra) show faces
      that are all equivalent by symmetry.
rationaleCorrect: |
  The orthorhombic system is uniquely identified by its axial definition: three unequal
  axes (a ≠ b ≠ c) that are all mutually perpendicular (alpha = beta = gamma = 90°) [ref:read-gemmology-3e].
  The crystal habit described – three different-sized pinacoid pairs at all right angles –
  perfectly expresses orthorhombic geometry. Gemmologically important orthorhombic gems:
  topaz (perfect basal cleavage), peridot (olivine), tanzanite (zoisite), chrysoberyl
  (alexandrite, cat's-eye), andalusite, danburite [ref:read-gemmology-3e]. All are biaxial and show true
  trichroism. The distinction from tetragonal (a = b ≠ c) is the key: equal horizontal
  axes in tetragonal force two of the three face-pair sizes to be the same.

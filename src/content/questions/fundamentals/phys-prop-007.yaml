id: phys-prop-007
stem: |
  A student receives an unset faceted green stone. Testing reveals: RI 1.577–1.583,
  birefringence 0.006, uniaxial negative, SG 2.71, hardness approximately 7.5–8,
  inert under both LWUV and SWUV. A second green stone gives: RI 1.620–1.640,
  birefringence approximately 0.020, uniaxial negative, SG 3.06. Both are vivid
  medium-dark green. Which identification is correct for each stone?
type: mcq
options:
  - text: "Stone 1: emerald (beryl, uniaxial negative, RI 1.577–1.583, SG 2.67–2.78, hardness 7.5–8); Stone 2: green tourmaline (indicolite/verdelite, uniaxial negative, RI 1.620–1.640, SG 3.06)"
    isCorrect: true
    rationale: |
      Stone 1 matches emerald (green beryl): hexagonal, uniaxial negative, RI 1.577–1.583,
      SG 2.67–2.78, hardness 7.5–8 [ref:read-gemmology-3e]. The inert UV response is typical for non-Cr/non-V
      beryl varieties or some treated emeralds; Cr-bearing Colombian emeralds often show
      red fluorescence LWUV, but the UV response alone does not exclude emerald [ref:read-gemmology-3e]. Stone 2
      matches green tourmaline (verdelite or chrome tourmaline): trigonal, uniaxial
      negative, RI 1.620–1.640, birefringence up to 0.020 (one of the highest of common
      gems), SG 3.06 [ref:read-gemmology-3e].
  - text: "Stone 1: green tourmaline; Stone 2: emerald"
    isCorrect: false
    rationale: |
      The two identifications are reversed. Green tourmaline RI is 1.620–1.640, not
      1.577–1.583 [ref:read-gemmology-3e]. Emerald (beryl) RI is 1.577–1.583, not 1.620–1.640 [ref:read-gemmology-3e]. The RI ranges
      are well separated (by 0.04–0.06 units) and represent one of the most important
      pairings in FGA examination practice. The birefringence values also differ:
      emerald 0.005–0.009, tourmaline up to 0.020 [ref:read-gemmology-3e].
  - text: "Both stones are green sapphire (corundum); the RI range 1.577–1.583 represents omega only, while 1.620–1.640 represents different cut orientations of corundum"
    isCorrect: false
    rationale: |
      Corundum RI is 1.762–1.770 [ref:read-gemmology-3e] – neither 1.577–1.583 nor 1.620–1.640 is within
      corundum's published range by a large margin (0.18+ units difference). No
      orientation of corundum can give an RI reading of 1.577 on a standard refractometer;
      the minimum omega for corundum is 1.762.
rationaleCorrect: |
  Green beryl (emerald) and green tourmaline are both uniaxial negative – a property
  they share [ref:read-gemmology-3e]. The discrimination rests entirely on RI range and SG: emerald RI 1.577–1.583,
  SG 2.67–2.78; tourmaline RI 1.620–1.640, SG 3.06 [ref:read-gemmology-3e]. The ~0.04 RI gap between maximum
  emerald (1.583) and minimum tourmaline (1.620) is large enough to be read clearly on
  the refractometer. UV fluorescence adds information (Cr-bearing emerald may fluoresce
  red LWUV) [ref:read-gemmology-3e] but is not needed for the fundamental species identification.

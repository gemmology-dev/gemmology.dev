id: chem-jadeite-formula

stem: |
  A trainee, revising "jade," writes down a single formula and calls it "jade's chemical
  formula," without distinguishing jadeite from nephrite. Which formula correctly belongs to
  jadeite specifically?

type: mcq

options:
  - text: "NaAlSi2O6 — a single-chain inosilicate in the pyroxene group."
    isCorrect: true
    rationale: |
      Jadeite's formula is NaAlSi2O6, placing it in the pyroxene group as a single-chain
      inosilicate. This is chemically and structurally distinct from nephrite, which belongs
      to a different silicate chain group entirely.
  - text: "Ca(Mg,Fe)Si2O6, the diopside formula."
    isCorrect: false
    rationale: |
      This is diopside's formula, another pyroxene-group member. Diopside and jadeite are both
      single-chain pyroxenes but are chemically distinct species (sodium-aluminium jadeite vs.
      calcium-magnesium-iron diopside), and diopside is not what is meant by gem "jade."
  - text: "A double-chain silicate formula identical to nephrite's."
    isCorrect: false
    rationale: |
      Jadeite and nephrite do not share a formula or even a chain type: jadeite is a
      single-chain pyroxene, while nephrite (a compact tremolite-actinolite amphibole) is a
      double-chain silicate. Treating "jade" as one chemical substance obscures this
      important structural difference.

rationaleCorrect: |
  Jadeite's formula is NaAlSi2O6, an inosilicate belonging to the pyroxene group (a
  single-chain silicate), as confirmed both by the IMA pyroxene nomenclature and by
  crystal-growth literature on synthetic jadeite. "Jade" is a market umbrella term covering
  two chemically and structurally distinct minerals: jadeite (single-chain pyroxene) and
  nephrite (double-chain amphibole, from the tremolite-actinolite series). Treating jade as a
  single chemical species, or assuming jadeite's green colour requires essential chromium in
  its formula, are both common errors — jadeite's own end-member formula contains no
  chromium; trace Cr3+ is an allochromatic addition responsible for the finest "imperial"
  green jadeite jade.

